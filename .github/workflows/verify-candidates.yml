name: verify-candidates

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r hybrid/requirements.txt
      - name: Verify candidate KOLs
        run: python hybrid/verify_candidates.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
      - name: Commit verification result
        run: |
          git config user.name "tweet-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/verify_candidates.json
          git diff --quiet --staged || git commit -m "data: verify candidates $(date -u +%Y%m%d_%H%M)"
          git pull --rebase origin main || true
          git push
