name: hybrid-collect

on:
  schedule:
    - cron: "0 4 * * *"    # UTC 04:00 = HKT 12:00（午间版）
    - cron: "0 16 * * *"   # UTC 16:00 = HKT 24:00（晚间/隔夜版）
  workflow_dispatch:
    inputs:
      seed_only:
        description: "只解析 user_id 预热缓存，不拉时间线"
        type: boolean
        default: false
      max_kols:
        description: "限量采集前 N 个账号（0=全量 93 个）"
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 全量约35min+429退避余量；限量模式更快
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r hybrid/requirements.txt

      - name: Collect X timelines (hybrid pilot)
        run: python hybrid/main.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          SEED_ONLY: ${{ inputs.seed_only }}
          MAX_KOLS: ${{ inputs.max_kols }}

      - name: Upload data artifact（即使 Collect 部分失败也抢救数据）
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-data
          path: |
            data/hybrid_tweets_*.json
            hybrid/user_ids.json
          retention-days: 30
        if: always()

      - name: Pretag candidate signals（第二批优化 B 项：方向词+互动阈值预打标）
        run: python hybrid/pretag.py

      - name: 生成信号简报（主题分类 + 情绪聚合 + 共识度）
        run: |
          TODAY=$(date -u +%Y%m%d)
          python hybrid/generate_brief.py \
            --input "data/hybrid_tweets_${TODAY}.json" \
            --output "data/brief_${TODAY}.json"
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "tweet-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/*.json 2>/dev/null || true
          git add -f hybrid/user_ids.json 2>/dev/null || true
          git diff --quiet --staged || git commit -m "data: hybrid $(date -u +%Y%m%d)"
          git pull --rebase origin main
          git push

      - name: Upload brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-brief
          path: data/brief_*.json
          retention-days: 30
        if: success() || failure()
