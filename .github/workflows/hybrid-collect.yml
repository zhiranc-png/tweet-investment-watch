name: hybrid-collect

on:
  schedule:
    - cron: "0 */3 * * *"  # UTC 每 3 小时 = HKT 8/11/14/17/20/23/2/5 点，增量模式每轮 10-25 分钟（2026-09-01 v5）
  workflow_dispatch:
    inputs:
      seed_only:
        description: "只解析 user_id 预热缓存，不拉时间线"
        type: boolean
        default: false
      skip_health_check:
        description: "跳过健康检查（强制采集）"
        type: boolean
        default: false
      max_kols:
        description: "限制本轮最多采集的 KOL 数（ Limited 模式，不更新 state）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # 全量窗口（首轮/过期回退）实测 ~86 分钟；增量轮 15-25 分钟（2026-09-01 v5）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r hybrid/requirements.txt

      # ===== 采集前：健康检查（判断是否需要跳过） =====
      - name: Health check - pre-collect
        id: pre_check
        run: |
          if [ "${{ inputs.skip_health_check }}" = "true" ]; then
            echo "跳过健康检查（手动触发）"
            exit 0
          fi
          python hybrid/health_check.py --check-skip
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 42 ]; then
            echo "处于冷却/暂停状态，跳过本次采集"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ===== 采集 X 时间线 =====
      - name: Collect X timelines (hybrid pilot)
        if: steps.pre_check.outputs.skip != 'true'
        id: collect
        run: |
          START_TIME=$(date +%s)
          python hybrid/main.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "采集耗时：${DURATION} 秒"
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          SEED_ONLY: ${{ inputs.seed_only }}
          MAX_KOLS: ${{ inputs.max_kols }}
          INCREMENTAL: "1"

      - name: Upload data artifact（即使 Collect 部分失败也抢救数据）
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-data
          path: |
            data/hybrid_tweets_*.json
            data/hybrid_state.json
            hybrid/user_ids.json
          retention-days: 30
        if: always()

      # ===== 预打标 =====
      - name: Pretag candidate signals
        if: steps.pre_check.outputs.skip != 'true'
        run: python hybrid/pretag.py
        continue-on-error: true

      # ===== 生成信号简报 =====
      - name: 生成信号简报（主题分类 + 情绪聚合 + 共识度）
        if: steps.pre_check.outputs.skip != 'true'
        id: brief
        run: |
          TODAY=$(date -u +%Y%m%d)
          python hybrid/generate_brief.py \
            --input "data/hybrid_tweets_${TODAY}.json" \
            --output "data/brief_${TODAY}.json"
        continue-on-error: true

      # ===== 采集后：健康检查 =====
      - name: Health check - post-collect
        if: steps.pre_check.outputs.skip != 'true' && always()
        id: post_check
        run: |
          TODAY=$(date -u +%Y%m%d)
          DURATION="${{ steps.collect.outputs.duration }}"
          python hybrid/health_check.py \
            --evaluate \
            --tweets "data/hybrid_tweets_${TODAY}.json" \
            --brief "data/brief_${TODAY}.json" \
            --duration "${DURATION:-0}"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        continue-on-error: true

      # ===== 提交数据 =====
      - name: Commit data
        if: steps.pre_check.outputs.skip != 'true'
        run: |
          git config user.name "tweet-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ hybrid/user_ids.json data/health_status.json 2>/dev/null || true
          git diff --quiet --staged || git commit -m "data: hybrid $(date -u +%Y%m%d)"
          git pull --rebase origin main
          # 重试 3 次 push
          for i in 1 2 3; do
            git push && break
            echo "push 失败，重试第 $i 次..."
            git pull --rebase origin main
            sleep 5
          done

      # ===== 上传 artifact =====
      - name: Upload brief artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: x-brief
          path: data/brief_*.json
          retention-days: 30

      - name: Upload health status artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-status
          path: data/health_status.json
          retention-days: 90
