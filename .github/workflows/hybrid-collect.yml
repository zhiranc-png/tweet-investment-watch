name: hybrid-collect

on:
  schedule:
    - cron: "0 4 * * *"    # UTC 04:00 = HKT 12:00（午间版）
    - cron: "0 16 * * *"   # UTC 16:00 = HKT 24:00（晚间/隔夜版）
  workflow_dispatch:
    inputs:
      seed_only:
        description: "只解析 user_id 预热缓存，不拉时间线"
        type: boolean
        default: false
      max_kols:
        description: "限量采集前 N 个账号（0=全量 93 个）"
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 全量约35min+429退避余量；限量模式更快
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r hybrid/requirements.txt

      - name: Collect X timelines (hybrid pilot)
        run: python hybrid/main.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          SEED_ONLY: ${{ inputs.seed_only }}
          MAX_KOLS: ${{ inputs.max_kols }}

      - name: Upload data artifact（即使 Collect 部分失败也抢救数据）
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-data
          path: |
            data/hybrid_tweets_*.json
            hybrid/user_ids.json
          retention-days: 30
        if: always()

      - name: Pretag candidate signals（第二批优化 B 项：方向词+互动阈值预打标）
        run: python hybrid/pretag.py
        continue-on-error: true

      - name: 生成信号简报（主题分类 + 情绪聚合 + 共识度）
        id: brief
        run: |
          TODAY=$(date -u +%Y%m%d)
          INPUT="data/hybrid_tweets_${TODAY}.json"
          OUTPUT="data/brief_${TODAY}.json"
          
          if [ -f "$INPUT" ]; then
            python hybrid/generate_brief.py --input "$INPUT" --output "$OUTPUT"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️  输入文件不存在: $INPUT"
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-brief
          path: data/brief_*.json
          retention-days: 30
        if: success() || failure()

      - name: Commit data（带重试，失败不影响整体状态）
        run: |
          git config user.name "tweet-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          
          # 最多重试 3 次
          for i in 1 2 3; do
            echo "--- Commit 尝试 $i ---"
            git add -f data/*.json 2>/dev/null || true
            git add -f hybrid/user_ids.json 2>/dev/null || true
            
            if git diff --quiet --staged; then
              echo "没有变更，跳过 commit"
              exit 0
            fi
            
            git commit -m "data: hybrid $(date -u +%Y%m%d)"
            
            if git pull --rebase origin main && git push; then
              echo "✅ Commit & push 成功"
              exit 0
            fi
            
            echo "❌ 第 $i 次失败，10秒后重试..."
            sleep 10
          done
          
          echo "❌ 3 次重试全部失败"
          exit 1
        continue-on-error: true
