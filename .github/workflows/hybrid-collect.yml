name: hybrid-collect

on:
  schedule:
    - cron: "0 4 * * *"    # UTC 04:00 = HKT 12:00（Jaron 2026-08-27 拍板中午跑；旧流程已让位到 05:00）
  workflow_dispatch:
    inputs:
      seed_only:
        description: "只解析 user_id 预热缓存，不拉时间线"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40    # 93个KOL全量采集，按经验约20-25min，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r hybrid/requirements.txt

      - name: Collect X timelines (hybrid pilot)
        run: python hybrid/main.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          SEED_ONLY: ${{ inputs.seed_only }}

      - name: Pretag candidate signals（第二批优化 B 项：方向词+互动阈值预打标）
        run: python hybrid/pretag.py

      - name: Commit data
        run: |
          git config user.name "tweet-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/*.json 2>/dev/null || true
          git add -f hybrid/user_ids.json 2>/dev/null || true
          git diff --quiet --staged || git commit -m "data: hybrid $(date -u +%Y%m%d)"
          git pull --rebase origin main
          git push
