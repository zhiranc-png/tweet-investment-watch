name: 投资舆情每日采集

on:
  schedule:
    # 每天 UTC 04:00 = 北京时间 12:00
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      per_user:
        description: '每人采集条数'
        required: false
        default: '20'
      hours:
        description: '时间窗口（小时）'
        required: false
        default: '48'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 采集 X 投资舆情（主流程）
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data report
          python main.py run \
            --output report/daily_report.md \
            --per-user ${{ github.event.inputs.per_user || 20 }} \
            --hours ${{ github.event.inputs.hours || 48 }}

      - name: 采集多源中文数据（补充）
        run: |
          python -c "
import sys, json
sys.path.insert(0, '.')
from src.collectors.multi_source_manager import MultiSourceCollector
from src.collectors.filter import filter_investment_posts

mgr = MultiSourceCollector()
results = mgr.collect_all()
all_posts = mgr.get_all_posts(results)
filtered = filter_investment_posts(all_posts)

# 保存
with open('data/multi_source.json', 'w', encoding='utf-8') as f:
    json.dump([p.to_dict() for p in filtered], f, ensure_ascii=False, indent=2)

print(f'多源采集: {len(all_posts)} 条 → 投资相关 {len(filtered)} 条')
" || echo "多源采集部分失败，继续主流程"

      - name: Upload tweets data
        uses: actions/upload-artifact@v4
        with:
          name: tweet-data
          path: data/tweets_*.json
          retention-days: 30

      - name: Upload brief data
        uses: actions/upload-artifact@v4
        with:
          name: brief-data
          path: data/brief_*.json
          retention-days: 30

      - name: Upload multi-source data
        uses: actions/upload-artifact@v4
        with:
          name: multi-source-data
          path: data/multi_source.json
          retention-days: 30
        if: success() || failure()

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report/daily_report.md
          retention-days: 30
