name: 投资舆情每日采集（多源版）

on:
  schedule:
    # 北京时间 08:30（早间版）= UTC 00:30
    - cron: '30 0 * * *'
    # 北京时间 20:30（晚间版）= UTC 12:30
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      per_user:
        description: 'X 每人采集条数'
        required: false
        default: '20'
      hours:
        description: '时间窗口（小时）'
        required: false
        default: '48'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # 用于提交快照到仓库

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，便于 commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedparser

      - name: Run full multi-source pipeline
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data report
          python run_all.py

      - name: Upload X tweets data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-tweets
          path: data/tweets_*.json
          retention-days: 30

      - name: Upload X brief data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-brief
          path: data/brief_*.json
          retention-days: 30

      - name: Upload Xueqiu data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xueqiu-data
          path: data/xueqiu_tweets_*.json
          retention-days: 30

      - name: Upload price data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-data
          path: data/prices_*.json
          retention-days: 30

      - name: Upload news data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: data/news_*.json
          retention-days: 30

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report/daily_report.md
          retention-days: 90

      - name: 飞书推送精简日报
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "推送飞书精简版日报..."
          python feishu_notify.py
          echo "推送完成（失败也继续执行后续步骤）"

      - name: 提交快照到仓库（带重试）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          for i in 1 2 3; do
            echo "--- 快照提交尝试 $i ---"
            git add data/*.json 2>/dev/null || true
            git add report/*.md 2>/dev/null || true
            
            if git diff --quiet --staged; then
              echo "没有变更，跳过"
              exit 0
            fi
            
            git commit -m "chore: 更新日报快照 [skip ci]"
            
            if git pull --rebase origin main && git push; then
              echo "✅ 提交成功"
              exit 0
            fi
            
            echo "第 $i 次失败，5秒后重试..."
            sleep 5
          done
          
          echo "❌ 3 次重试全部失败"
          exit 1
