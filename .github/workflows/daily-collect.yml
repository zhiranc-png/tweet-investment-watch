name: 投资舆情每日采集（多源版）

on:
  schedule:
    - cron: '0 4 * * *'  # 每天 UTC 4:00 = 北京时间 12:00
  workflow_dispatch:  # 手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run multi-source collection
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data
          python main.py run-all \
            --auth-token "$AUTH_TOKEN" \
            --ct0 "$CT0" \
            --output report.md \
            --limit 120

      - name: Upload tweets artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweets-raw
          path: data/tweets_*.json
          retention-days: 30

      - name: Upload multi-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-source
          path: data/multi_*.json
          retention-days: 30

      - name: Upload brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: brief-data
          path: data/brief_*.json
          retention-days: 90

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report.md
          retention-days: 90

      - name: Print summary
        run: |
          echo "## 采集完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls data/brief_*.json 1> /dev/null 2>&1; then
            python -c "
import json, glob
files = glob.glob('data/brief_*.json')
if files:
    with open(files[0]) as f:
        data = json.load(f)
    stats = data.get('stats', {})
    print(f'**总数据量**: {stats.get(\"total_posts\", 0)} 条')
    print()
    print('**各来源数据量**:')
    for src, cnt in stats.get('source_counts', {}).items():
        print(f'- {src}: {cnt} 条')
    print()
    keywords = data.get('hot_keywords', [])[:10]
    if keywords:
        print('**热门关键词**:')
        for kw in keywords:
            print(f'- {kw[\"keyword\"]} ({kw[\"count\"]}次)')
" >> $GITHUB_STEP_SUMMARY
          fi
