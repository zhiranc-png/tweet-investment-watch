name: 投资舆情每日采集（多源版）

on:
  schedule:
    # 北京时间 12:00（午间）= UTC 04:00
    - cron: '0 4 * * *'
    # 北京时间 24:00（午夜）= UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      per_user:
        description: 'X 每人采集条数'
        required: false
        default: '20'
      hours:
        description: '时间窗口（小时）'
        required: false
        default: '48'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedparser

      - name: Run full multi-source pipeline
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data report
          python run_all.py

      - name: Upload X tweets data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-tweets
          path: data/tweets_*.json
          retention-days: 30

      - name: Upload X brief data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-brief
          path: data/brief_*.json
          retention-days: 30

      - name: Upload Xueqiu data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xueqiu-data
          path: data/xueqiu_tweets_*.json
          retention-days: 30

      - name: Upload price data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-data
          path: data/prices_*.json
          retention-days: 30

      - name: Upload news data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: data/news_*.json
          retention-days: 30

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report/daily_report.md
          retention-days: 90

      - name: 飞书推送精简日报
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "推送飞书精简版日报..."
          python feishu_notify.py
          echo "推送完成（失败也继续执行后续步骤）"

      - name: 提交快照到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_snapshot.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 更新日报快照 [skip ci]" && git push
