name: 推特投资舆情每日采集

on:
  schedule:
    # 每天 UTC 04:00 = 北京时间 12:00
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '采集数量上限'
        required: false
        default: '120'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run collection
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data
          python main.py collect --output data/tweets.json --limit 120

      - name: Generate brief
        run: |
          python main.py brief --input data/tweets.json --output data/brief.json

      - name: Generate basic report
        run: |
          python main.py report --brief data/brief.json --output report.md

      - name: Upload tweets data
        uses: actions/upload-artifact@v4
        with:
          name: tweet-data
          path: data/tweets.json
          retention-days: 30

      - name: Upload brief data
        uses: actions/upload-artifact@v4
        with:
          name: brief-data
          path: data/brief.json
          retention-days: 30

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report.md
          retention-days: 30
