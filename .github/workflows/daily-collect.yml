name: 多源中文采集（原投资舆情每日采集）

# ─────────────────────────────────────────────────────────────────
# 2026-08-27 第二批优化 A 项：X 采集部分正式退役。
# 原因：X 采集已由 hybrid/ 管道（hybrid-collect.yml，UTC 04:00）承担，
#       旧管道的 X 主流程与本仓库共用同一小号 cookie 限流窗口，双跑必撞 429。
# 保留：多源中文采集（华尔街见闻/财联社/雪球/知乎/微博等）作为日报中文圈补充数据源，
#       并新增「数据提交回仓库」步骤，与 hybrid 数据同目录永久可溯。
# 如需恢复 X 部分：取消下方注释块即可（代码未删）。
# ─────────────────────────────────────────────────────────────────

on:
  schedule:
    # 每天 UTC 04:10 = HKT 12:10（第二批优化 A 项吸收动作：早于 12:50 的日报任务跑完并提交，
    # 让日报当日即可读取 data/multi_source_<今日>.json 作为中文圈补充源；不占用 X 小号限流窗口）
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      # ── X 采集部分已退役（2026-08-27，第二批优化 A 项）──
      # X 时间线采集统一由 hybrid/ 管道负责；此处不再消耗小号限流窗口。
      # - name: 采集 X 投资舆情（主流程）【已退役】
      #   env:
      #     AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      #     CT0: ${{ secrets.CT0 }}
      #   run: |
      #     mkdir -p data report
      #     python main.py run \
      #       --output report/daily_report.md \
      #       --per-user 20 \
      #       --hours 48 \
      #       --v2 \
      #       --with-price

      - name: 采集多源中文数据（保留，日报中文圈补充源）
        run: python collect_multi_source.py || echo "多源采集部分失败，继续主流程"

      - name: 多源数据提交回仓库（可溯，与 hybrid 数据同目录）
        run: |
          if [ -f data/multi_source.json ]; then
            cp data/multi_source.json "data/multi_source_$(date -u +%Y%m%d).json"
            git config user.name "tweet-watch-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/multi_source_*.json
            git diff --quiet --staged || git commit -m "data: multi-source $(date -u +%Y%m%d)"
            git push
          else
            echo "多源数据不存在，跳过提交"
          fi

      - name: Upload multi-source data
        uses: actions/upload-artifact@v4
        with:
          name: multi-source-data
          path: data/multi_source.json
          retention-days: 30
        if: success() || failure()

