name: daily-collect-multi

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Run collection
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: |
          mkdir -p data
          python main.py run-all --auth-token "$AUTH_TOKEN" --ct0 "$CT0" --output report.md --limit 120
      - uses: actions/upload-artifact@v4
        with:
          name: brief-data
          path: data/brief_*.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: multi-source
          path: data/multi_*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report.md
          retention-days: 90
