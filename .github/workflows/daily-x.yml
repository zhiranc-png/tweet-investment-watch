name: X 投资舆情每日采集
on:
  schedule:
    - cron: '0 4 * * *'  # 北京时间 12:00
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 采集 X 推文并生成报告
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
        run: python run_x_collect.py --per-user 20 --top 30 --output data/x_brief.json --report report/x_report.md
      - name: 上传简报数据
        uses: actions/upload-artifact@v4
        with:
          name: x-brief-data
          path: data/x_brief.json
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: x-report
          path: report/x_report.md
